plugins { id 'com.android.application' }
android {
    namespace 'com.locky.app'
    compileSdk 35
    defaultConfig { applicationId 'com.locky.app'; minSdk 26; targetSdk 35; versionCode 4; versionName '1.1.2'; buildConfigField 'String', 'APP_SCHEME', '"locky"'; testInstrumentationRunner 'androidx.test.runner.AndroidJUnitRunner' }
    signingConfigs { personal { storeFile file('../signing/personal.p12'); storePassword 'locky-personal'; keyAlias 'locky'; keyPassword 'locky-personal' } }
    buildTypes { debug { signingConfig signingConfigs.personal }; release { signingConfig signingConfigs.personal; minifyEnabled false } }
    buildFeatures { buildConfig true }
    compileOptions { sourceCompatibility JavaVersion.VERSION_17; targetCompatibility JavaVersion.VERSION_17; coreLibraryDesugaringEnabled true }
    packaging { resources.excludes += ['META-INF/DEPENDENCIES', 'META-INF/LICENSE*', 'META-INF/NOTICE*'] }
}
dependencies {
    coreLibraryDesugaring 'com.android.tools:desugar_jdk_libs:2.1.5'
    implementation 'androidx.core:core:1.15.0'
    implementation 'androidx.webkit:webkit:1.12.1'
    implementation 'androidx.browser:browser:1.8.0'
    implementation 'com.squareup.okhttp3:okhttp:4.12.0'
    implementation 'com.nimbusds:nimbus-jose-jwt:9.47'
    testImplementation 'junit:junit:4.13.2'
    testImplementation 'org.json:json:20240303'
    androidTestImplementation 'androidx.test:runner:1.6.2'
    androidTestImplementation 'androidx.test.ext:junit:1.2.1'
    androidTestImplementation 'androidx.test.uiautomator:uiautomator:2.3.0'
}
