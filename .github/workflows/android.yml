name: Locky Android
# APK 배포는 커밋 메시지에 [release-apk]가 포함될 때만 실행합니다.
# 일반 push에서는 빌드 작업을 건너뛰며, 전체 검증은 수동 실행으로 유지합니다.
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: locky-main
  cancel-in-progress: true
jobs:
  ui:
    if: ${{ github.event_name == 'workflow_dispatch' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Browser interaction checks
        run: |
          node scripts/nowbar-ui-test.cjs
          npm install --no-save --package-lock=false --ignore-scripts --no-audit --no-fund playwright
          npx playwright install --with-deps chromium
          node scripts/ui-test.cjs
          node scripts/ui-revisions-test.cjs
  dictionary-release:
    if: ${{ github.event_name == 'push' && contains(github.event.head_commit.message, '[release-apk]') }}
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 2
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - uses: android-actions/setup-android@v3
        with:
          packages: 'platform-tools platforms;android-36 build-tools;35.0.0'
          log-accepted-android-sdk-licenses: false
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.11.1'
          cache-disabled: true
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Browser screenshots from actual Locky assets
        run: |
          npm install --no-save --package-lock=false --ignore-scripts --no-audit --no-fund playwright
          npx playwright install --with-deps chromium
          node scripts/capture-ui.cjs
      - name: Focused dictionary and rendering regression tests
        run: gradle :app:testDebugUnitTest --tests 'com.locky.app.DictionaryReturnTest' --tests 'com.locky.app.OverlayRenderingTest' --no-daemon
      - name: Build signed release APK
        run: gradle :app:assembleRelease --no-daemon
      - name: Verify and publish directly installable APK
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          mkdir -p distribution
          cp app/build/outputs/apk/release/app-release.apk distribution/Locky.apk
          "$ANDROID_HOME/build-tools/35.0.0/apksigner" verify --print-certs distribution/Locky.apk > distribution/signature.txt
          (cd distribution && sha256sum Locky.apk > SHA256SUMS.txt)
          gh release create "locky-build-${GITHUB_RUN_NUMBER}" distribution/Locky.apk distribution/SHA256SUMS.txt distribution/signature.txt distribution/ui-*.png --target "$GITHUB_SHA" --title "Locky 1.1.3 · 통합 UI 개편 · build ${GITHUB_RUN_NUMBER}" --notes "시작화면, 관리 앱, 설정, 브리핑, 메모, ChatGPT의 시각 체계를 개편하고 라이트·다크 화면을 지원합니다. 첨부 화면 이미지는 실제 앱 자산을 브라우저에서 렌더링한 것으로 삼성 실기기 캡처는 아닙니다. 설치 서명과 사용자 데이터는 유지합니다."
          python3 scripts/prune-releases.py
  android:
    needs: ui
    if: ${{ github.event_name == 'workflow_dispatch' && needs.ui.result == 'success' }}
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - uses: android-actions/setup-android@v3
        with:
          packages: 'platform-tools platforms;android-36 build-tools;35.0.0'
          log-accepted-android-sdk-licenses: false
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.11.1'
          cache-disabled: true
      - name: Policy tests, lint and signed APK
        id: policy
        if: ${{ !cancelled() }}
        run: |
          result=0
          gradle :app:testDebugUnitTest :app:lintDebug :app:assembleRelease :app:assembleDebug :app:assembleDebugAndroidTest :fixture:assembleDebug --no-daemon || result=$?
          if [ "$result" != 0 ]; then
            find app/build -name 'lint-results-*.txt' -exec cat {} +
          fi
          exit "$result"
      - name: Enable KVM
        if: ${{ !cancelled() && steps.policy.outcome == 'success' }}
        run: |
          sudo rm -rf /usr/share/dotnet /opt/ghc /usr/local/lib/android/sdk/ndk
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Android lifecycle and integration tests
        if: ${{ !cancelled() && steps.policy.outcome == 'success' }}
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 35
          arch: x86_64
          target: google_apis
          emulator-boot-timeout: 180
          disable-animations: true
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -camera-back none -partition-size 2048 -memory 2048
          script: bash scripts/android-test.sh
      - name: Verify distributable
        if: ${{ success() && needs.ui.result == 'success' }}
        run: |
          mkdir -p distribution
          cp app/build/outputs/apk/release/app-release.apk distribution/Locky.apk
          "$ANDROID_HOME/build-tools/35.0.0/apksigner" verify --print-certs distribution/Locky.apk > distribution/signature.txt
          (cd distribution && sha256sum Locky.apk > SHA256SUMS.txt)
      - name: Publish direct APK
        if: ${{ success() && needs.ui.result == 'success' }}
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release create "locky-build-${GITHUB_RUN_NUMBER}" distribution/Locky.apk distribution/SHA256SUMS.txt distribution/signature.txt --target "$GITHUB_SHA" --title "Locky 1.1.3 · build ${GITHUB_RUN_NUMBER}" --notes-file scripts/release-notes.md
      - name: Keep three successful automatic releases
        if: ${{ success() && needs.ui.result == 'success' }}
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: python3 scripts/prune-releases.py

