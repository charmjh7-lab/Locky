name: Locky Android
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: locky-main
  cancel-in-progress: true
jobs:
  android:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
        with:
          packages: 'platform-tools platforms;android-35 build-tools;35.0.0'
          log-accepted-android-sdk-licenses: false
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.11.1'
          cache-disabled: true
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Browser interaction checks
        run: |
          npm install --no-save --package-lock=false --ignore-scripts --no-audit --no-fund playwright
          npx playwright install --with-deps chromium
          node scripts/ui-test.cjs
      - name: Policy tests, lint and signed APK
        run: gradle :app:testDebugUnitTest :app:lintDebug :app:assembleRelease --no-daemon
      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Android lifecycle and integration tests
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 35
          arch: x86_64
          target: google_apis
          disable-animations: true
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -camera-back none
          script: gradle :app:connectedDebugAndroidTest --no-daemon
      - name: Verify distributable
        run: |
          mkdir -p distribution
          cp app/build/outputs/apk/release/app-release.apk distribution/Locky.apk
          "$ANDROID_HOME/build-tools/35.0.0/apksigner" verify --print-certs distribution/Locky.apk > distribution/signature.txt
          (cd distribution && sha256sum Locky.apk > SHA256SUMS.txt)
      - name: Publish direct APK
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release create "locky-build-${GITHUB_RUN_NUMBER}" distribution/Locky.apk distribution/SHA256SUMS.txt distribution/signature.txt --target "$GITHUB_SHA" --title "Locky 1.0.0 · build ${GITHUB_RUN_NUMBER}" --notes-file scripts/release-notes.md
      - name: Keep three successful automatic releases
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: python3 scripts/prune-releases.py
