name: Locky direct APP_GATE build
on:
  push:
    branches: [fix/app-gate-direct-exposure-20261031]
permissions:
  contents: write
jobs:
  release-apk:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.11.1'
          cache-disabled: true
      - name: Android SDK components
        run: |
          sdkmanager="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"
          missing=()
          test -f "$ANDROID_HOME/platforms/android-36/android.jar" || missing+=("platforms;android-36")
          test -x "$ANDROID_HOME/build-tools/35.0.0/apksigner" || missing+=("build-tools;35.0.0")
          if [ "${#missing[@]}" -gt 0 ]; then
            yes | "$sdkmanager" --licenses > /dev/null || true
            "$sdkmanager" --install "${missing[@]}"
          fi
      - name: Gate-focused tests and signed APK
        run: |
          gradle :app:testDebugUnitTest --tests 'com.locky.app.GateRestoreTest' --tests 'com.locky.app.OverlayRenderingTest' --tests 'com.locky.app.GateCatalogTest' :app:assembleRelease --no-daemon
      - name: Check certificate and APK version
        run: |
          mkdir -p distribution
          cp app/build/outputs/apk/release/app-release.apk distribution/Locky.apk
          "$ANDROID_HOME/build-tools/35.0.0/apksigner" verify --print-certs distribution/Locky.apk > distribution/signature.txt
          expected=$(keytool -exportcert -keystore signing/personal.p12 -alias locky -storepass locky-personal | sha256sum | cut -d' ' -f1)
          actual=$(sed -n 's/^Signer #1 certificate SHA-256 digest: //p' distribution/signature.txt)
          test "$actual" = "$expected"
          "$ANDROID_HOME/build-tools/35.0.0/aapt" dump badging distribution/Locky.apk | grep -q "name='com.locky.app' versionCode='21' versionName='1.3.6-direct-gate'"
          (cd distribution && sha256sum Locky.apk > SHA256SUMS.txt)
      - name: Publish installable signed APK
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release create "app-gate-direct-20261031" distribution/Locky.apk distribution/SHA256SUMS.txt distribution/signature.txt \
            --target "$GITHUB_SHA" \
            --title "Locky 1.3.6 · direct APP_GATE" \
            --notes "APP_GATE immediate native transition cover; eliminate ordinary Chromium visual-state gating; preserve current-entry input checks; prepare catalog asynchronously; reduce checkpoint and usage reads. Focused gate regression tests." \
            --prerelease --latest=false
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: Locky-direct-app-gate
          path: |
            distribution/
            app/build/test-results/testDebugUnitTest/*.xml
          retention-days: 7
